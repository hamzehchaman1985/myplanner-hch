name: My Planner Reminders

on:
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call Supabase reminder function
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is missing."
            exit 1
          fi

          HTTP_CODE=$(curl --silent --show-error             --output response.txt             --write-out "%{http_code}"             --request POST             "https://tskpdopzrqfqgtmjnejq.supabase.co/functions/v1/send-reminders"             --header "Content-Type: application/json"             --header "x-cron-secret: $CRON_SECRET"             --data "{}")

          cat response.txt
          echo
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
